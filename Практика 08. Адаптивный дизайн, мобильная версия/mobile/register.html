  <main>
    
    
<h1>Регистрация</h1>
<form method="post" class="form">
  
  <label>Логин
    <input name="login" required="" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" value="">
    
  </label>
  <label>ФИО
    <input name="full_name" required="" minlength="5" maxlength="100" value="">
    
  </label>
  <label>Пароль
    <input name="password" type="password" required="" minlength="8" maxlength="128">
    
  </label>
  <label>Почта
    <input name="email" type="email" required="" maxlength="100" value="">
    
  </label>
  <label>Телефон
    <input name="phone" type="tel" required="" maxlength="16" value="" placeholder="+79991234567">
    
  </label>
  <button class="btn" type="submit">Зарегистрироваться</button>
</form>

  </main>
  <footer class="footer">Конференции.РФ. Учебный проект, МДК 09.01</footer>
