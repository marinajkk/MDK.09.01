{% extends "base.html" %}
{% block title %}{{ event['title'] }}{% endblock %}
{% block content %}
<h1>{{ event['title'] }}</h1>
<p>Дата: {{ event['event_date'] }}</p>
<p>Место: {{ event['place'] }}</p>
<p>{{ event['description'] }}</p>
<p><a class="btn" href="{{ url_for('main.new_request', event_id=event['id']) }}">Подать заявку</a></p>
{% endblock %}
