{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Логин
    <input name="login" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" value="{{ values.get('login', '') }}">
    {% if errors.login %}<span class="err">{{ errors.login }}</span>{% endif %}
  </label>
  <label>ФИО
    <input name="full_name" required minlength="5" maxlength="100" value="{{ values.get('full_name', '') }}">
    {% if errors.full_name %}<span class="err">{{ errors.full_name }}</span>{% endif %}
  </label>
  <label>Пароль
    <input name="password" type="password" required minlength="8" maxlength="128">
    {% if errors.password %}<span class="err">{{ errors.password }}</span>{% endif %}
  </label>
  <label>Почта
    <input name="email" type="email" required maxlength="100" value="{{ values.get('email', '') }}">
    {% if errors.email %}<span class="err">{{ errors.email }}</span>{% endif %}
  </label>
  <label>Телефон
    <input name="phone" type="tel" required maxlength="16" value="{{ values.get('phone', '') }}" placeholder="+79991234567">
    {% if errors.phone %}<span class="err">{{ errors.phone }}</span>{% endif %}
  </label>
  <button class="btn" type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
