{% extends "base.html" %}
{% block title %}Отзыв{% endblock %}
{% block content %}
<h1>Отзыв о мероприятии</h1>
<p class="muted">{{ item['event_title'] }}, заявка № {{ item['id'] }}</p>
<form method="post" class="form" data-validate novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Оценка
    <select name="rating" required>
      <option value="">Выберите</option>
      {% for i in [5, 4, 3, 2, 1] %}<option value="{{ i }}" {% if values.get('rating') == i|string %}selected{% endif %}>{{ i }}</option>{% endfor %}
    </select>
    {% if errors.rating %}<span class="err">{{ errors.rating }}</span>{% endif %}
  </label>
  <label>Отзыв
    <textarea name="body" rows="5" required minlength="10" maxlength="1000">{{ values.get('body', '') }}</textarea>
    {% if errors.body %}<span class="err">{{ errors.body }}</span>{% endif %}
  </label>
  <button class="btn" type="submit">Отправить отзыв</button>
</form>
{% endblock %}
