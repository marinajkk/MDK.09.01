<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Конференции.РФ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('main.index') }}">Конференции.РФ</a>
    <nav>
      <a href="{{ url_for('main.index') }}">Мероприятия</a>
      {% if g.user %}
        <a href="{{ url_for('main.my_requests') }}">Мои заявки</a>
        <a href="{{ url_for('main.new_request') }}">Новая заявка</a>
        {% if g.user['role'] == 'admin' %}<a href="{{ url_for('admin.index') }}">Панель</a>{% endif %}
        <a href="{{ url_for('auth.logout') }}">Выйти ({{ g.user['login'] }})</a>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Войти</a>
        <a href="{{ url_for('auth.register') }}">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
